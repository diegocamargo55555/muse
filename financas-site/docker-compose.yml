services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fin}
      POSTGRES_DB: ${POSTGRES_DB:-financas}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [web]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { memory: 256M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fin}"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: financas-api:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fin}:${POSTGRES_PASSWORD:-fin}@db:5432/${POSTGRES_DB:-financas}?sslmode=disable
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks: [web]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 20s

  web:
    build: ./frontend
    image: financas-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3003}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [web]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { memory: 64M }

networks:
  web:

volumes:
  pg-data:
